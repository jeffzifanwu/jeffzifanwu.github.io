name: Deploy Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Verify resources.html exists
      - name: Verify resources.html
        run: |
          if [ ! -f docs/resources.html ]; then
            echo "Error: docs/resources.html does not exist"
            exit 1
          fi

      # Step 3: Inject the password into resources.html
      - name: Inject the password
        run: |
          sed -i "s/PLACEHOLDER_PASSWORD/${{ secrets.PAGE_PASSWORD }}/g" docs/resources.html

      # Step 4: Pull remote changes to avoid conflicts
      - name: Pull latest changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git pull origin main --rebase

      # Step 5: Commit and push changes
      - name: Commit and push changes
        run: |
          git add docs/resources.html
          git commit -m "Update resources.html with password"
          git push origin main
