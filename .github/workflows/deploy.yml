name: Deploy Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Check if docs/resources.html exists
      - name: Verify resources.html
        run: |
          if [ ! -f docs/resources.html ]; then
            echo "Error: docs/resources.html does not exist"
            exit 1
          fi

      # Step 3: Inject the password into resources.html
      - name: Inject the password
        run: |
          sed -i "s/PLACEHOLDER_PASSWORD/${{ secrets.PAGE_PASSWORD }}/g" docs/resources.html

      # Step 4: Check docs directory before deployment
      - name: Check docs directory
        run: |
          ls -R docs

      # Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
